org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compila Kotlin dentro del daemon de Gradle. El daemon de Kotlin aparte deja
# ficheros abiertos en build\<plugin>\kotlin\... y en Windows falla con
# "Unable to delete directory" al recompilar plugins (image_picker, etc.).
kotlin.compiler.execution.strategy=in-process
# En Windows el watcher de ficheros de Gradle mantiene handles abiertos en
# build\ y provoca el mismo error al limpiar caches de Kotlin.
org.gradle.vfs.watch=false
# Un daemon que no persiste entre compilaciones libera los handles al terminar.
org.gradle.daemon=false
# Sin cache incremental no se reutilizan directorios cacheable bloqueados.
kotlin.incremental=false
